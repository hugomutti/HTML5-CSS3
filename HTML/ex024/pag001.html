<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Site de teste para iframe</title>
    <style>
        body{
            font-family: Arial, Helvetica, sans-serif;
            
        }
        table{
            border-collapse: collapse;
            width: 520px;
        }
        th, td {
            border:1px solid black;  
            padding: 2px;
        }

        .cinza{
            background-color: rgb(54, 53, 53);
            color: white;
            text-align: center;
        }
        .center{
            text-align: center;
        }
        tr:nth-child(even){
            background-color: rgb(228, 228, 228);
        }
        #container{
            overflow: auto;
        }
    </style>
</head>
<body>
    <div id="container">
        <table>
            <caption>Boletim Escolar</caption>
            <table>
                <thead>
                    <tr>
                        <th rowspan="2" class="cinza">Área</th>
                        <th rowspan="2" class="cinza">Disciplinas</th>
                        <th colspan="2" class="cinza">Notas</th>
                        <th rowspan="2" class="cinza">Médias</th>
                    </tr>
                    <tr>
                        <th class="cinza">Nota 1</th>
                        <th class="cinza">Nota 2</th>
                    </tr>
                </thead>
                <tbody>
                    <tr>
                        <th rowspan="4">Exatas</th>
                        <td>Matemática</td>
                        <td class="center">10.0</td>
                        <td class="center">10.0</td>
                        <td class="center">10.0</td>
                    </tr>
                    <tr>
                        <td>Física</td>
                        <td class="center">10.0</td>
                        <td class="center">10.0</td>
                        <td class="center">10.0</td>
                    </tr>
                    <tr>
                        <td>Química</td>
                        <td class="center">10.0</td>
                        <td class="center">10.0</td>
                        <td class="center">10.0</td>
                    </tr>
                    <tr>
                        <td>Biologia</td>
                        <td class="center">10.0</td>
                        <td class="center">10.0</td>
                        <td class="center">10.0</td>
                    </tr>
                    <tr>
                        <th colspan="4" class="cinza" style="text-align: left;">Média Exatas</th>
                        <td class="cinza">10.0</td>
                    </tr>
                    <tr>
                        <th rowspan="2">Humanas</th>
                        <td>História</td>
                        <td class="center">10.0</td>
                        <td class="center">10.0</td>
                        <td class="center">10.0</td>
                    </tr>
                    <tr>
                        <td>Geografia</td>
                        <td class="center">10.0</td>
                        <td class="center">10.0</td>
                        <td class="center">10.0</td>
                    </tr>
                    <tr>
                        <th colspan="4" class="cinza" style="text-align: left;">Média Humanas</th>
                        <td class="cinza">10.0</td>
                    </tr
                </tbody>
            </table>
        </table>
    </div>
</body>
</html>
