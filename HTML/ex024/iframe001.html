<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iframes</title>
    <style>
        iframe{
            height: 500;
            width: 500;
            border: 2px solid black;
        }
    </style>
</head>
<body>

    <!--Tamanho padrão do iframe
    300(width)/150(height)pixels
    
    -->
    <h1>Testando o uso de um iframe</h1>

    <p>esse é  site <iframe src="https://www.cursoemvideo.com" frameborder="0" height="500" width="500" scrolling ='no'>
    <a href="https://www.cursoemvideo.com" target="_blank">Curso em Vídeo</a>
    </iframe> do curso em vídeo</p>

    <p>O repositório do Guanabara <iframe src="https://gustavoguanabara.github.io" frameborder="0" height="500" width="500" scrolling="yes">
    <a href="https://gustavoguanabara.github.io" target="_blank"> no Github</a>
    </iframe> é bem legal</p>
</body>
</html>
